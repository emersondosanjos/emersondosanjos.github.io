<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1600" height="576" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>DCMD desalination loop driven by recovered heat</title>
  <!-- Redrawn from the LabMEMS DCMD process diagram (feed loop hot, distillate loop cold) -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b42323"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2747b8"/></marker>
    <linearGradient id="mod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3f48"/><stop offset="0.48" stop-color="#9aa0aa"/>
      <stop offset="0.52" stop-color="#d9dde3"/><stop offset="1" stop-color="#f4f6fa"/>
    </linearGradient>
    <pattern id="memb" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe7da"/><circle cx="3" cy="3" r="1.2" fill="#a0784a"/></pattern>
    <g id="waves"><path d="M0 0 q5 -4 10 0 t10 0 t10 0 t10 0 t10 0" fill="none" stroke-width="1.4"/></g>
  </defs>
  <rect width="1000" height="360" fill="#fff"/>

  <!-- legend -->
  <g font-size="14" font-style="italic" font-weight="700">
    <line x1="24" y1="34" x2="74" y2="34" stroke="#b42323" stroke-width="2.4"/>
    <text x="84" y="39" fill="#b42323">Feed stream (hot)</text>
    <line x1="24" y1="60" x2="74" y2="60" stroke="#2747b8" stroke-width="2.4" stroke-dasharray="7 5"/>
    <text x="84" y="65" fill="#2747b8">Distillate stream (cold)</text>
  </g>

  <!-- ================= hot feed loop ================= -->
  <g stroke="#b42323" stroke-width="2.4" fill="none">
    <path d="M490 240 H310 V48 H882 V118"/>            <!-- module -> 6 -> riser -> top line -> 2 -> tank -->
    <path d="M310 106 H400"/>                            <!-- riser into HX-2 -->
    <path d="M680 106 H480"/>                            <!-- brackish well into HX-2 -->
    <path d="M480 134 H852"/>                            <!-- HX-2 -> 7 -> junction -> 8 -> tank -->
    <path d="M730 134 V64"/>                             <!-- reject -->
    <path d="M882 160 V246 H818"/>                       <!-- tank -> 3 -> HX-1 -->
    <path d="M748 246 H668"/>                            <!-- HX-1 -> 4 -> heat source -->
    <path d="M592 246 H492"/>                            <!-- heat source -> 5 -> module -->
  </g>
  <g stroke="none">
    <path d="M354 240 l10 -6 v12 z" fill="#b42323"/>    <!-- 6 arrow (left) -->
    <path d="M610 48 l-10 -6 v12 z" fill="#b42323"/>    <!-- 2 (right) -->
    <path d="M560 106 l10 -6 v12 z" fill="#b42323"/>    <!-- 1 (left) -->
    <path d="M630 134 l-10 -6 v12 z" fill="#b42323"/>   <!-- 7 -->
    <path d="M800 134 l-10 -6 v12 z" fill="#b42323"/>   <!-- 8 -->
    <path d="M730 78 l-6 10 h12 z" fill="#b42323"/>     <!-- 9 (up) -->
    <path d="M882 206 l-6 -10 h12 z" fill="#b42323"/>   <!-- 3 (down) -->
    <path d="M700 246 l10 -6 v12 z" fill="#b42323"/>    <!-- 4 -->
    <path d="M536 246 l10 -6 v12 z" fill="#b42323"/>    <!-- 5 -->
  </g>
  <rect x="724" y="128" width="12" height="12" fill="#b42323"/>
  <path d="M592 106 H680" stroke="#b42323" stroke-width="4"/>

  <!-- HX-2 -->
  <rect x="400" y="86" width="80" height="58" fill="#fff" stroke="#b42323" stroke-width="2"/>
  <use href="#waves" x="415" y="100" stroke="#b42323"/>
  <text x="440" y="78" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#b42323">HX-2</text>
  <text x="440" y="128" text-anchor="middle" font-size="13" font-style="italic" fill="#b42323">q<tspan font-size="9" dy="3">HX,2</tspan></text>
  <path d="M458 138 L476 116" stroke="#b42323" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- mixing tank -->
  <path d="M852 108 V160 H912 V108" fill="#fff" stroke="#b42323" stroke-width="2"/>
  <use href="#waves" x="857" y="124" stroke="#b42323" transform="scale(1)"/>
  <use href="#waves" x="857" y="136" stroke="#b42323"/>
  <use href="#waves" x="857" y="148" stroke="#b42323"/>
  <text x="922" y="134" font-size="14" font-style="italic" font-weight="700" fill="#b42323">Mixing</text>
  <text x="922" y="151" font-size="14" font-style="italic" font-weight="700" fill="#b42323">tank</text>

  <!-- HX-1 -->
  <rect x="748" y="226" width="70" height="44" fill="#fff" stroke="#b42323" stroke-width="2"/>
  <use href="#waves" x="758" y="252" stroke="#b42323"/>
  <text x="783" y="218" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#b42323">HX-1</text>
  <text x="783" y="244" text-anchor="middle" font-size="13" font-style="italic" fill="#b42323">q<tspan font-size="9" dy="3">HX,1</tspan></text>

  <!-- heat source -->
  <rect x="592" y="226" width="76" height="40" fill="#fff" stroke="#b42323" stroke-width="2"/>
  <text x="630" y="218" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#b42323">Heat source</text>
  <text x="622" y="252" text-anchor="middle" font-size="14" font-style="italic" fill="#b42323">q<tspan font-size="10" dy="3">h</tspan></text>
  <path d="M642 258 L660 244" stroke="#b42323" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- DCMD module -->
  <rect x="380" y="222" width="110" height="78" fill="url(#mod)" stroke="#20242c" stroke-width="2"/>
  <rect x="380" y="258" width="110" height="8" fill="url(#memb)" stroke="#20242c" stroke-width="0.8"/>
  <line x1="435" y1="236" x2="435" y2="282" stroke="#2747b8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#ab)"/>
  <text x="442" y="292" font-size="13" font-style="italic" fill="#2747b8">j<tspan font-size="9" dy="3">wl</tspan></text>
  <text x="435" y="212" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#b42323">DCMD module</text>

  <!-- ================= cold distillate loop ================= -->
  <g stroke="#2747b8" stroke-width="2.4" fill="none" stroke-dasharray="7 5">
    <path d="M162 280 H262"/>                     <!-- tank -> 13 -> heat sink -->
    <path d="M290 280 H380"/>                     <!-- heat sink -> 10 -> module -->
    <path d="M490 280 H882 V332 H130 V298"/>      <!-- module -> 11 -> HX-1 -> 12 -> return -->
    <path d="M100 280 H74 V312"/>                 <!-- overflow 14 -->
  </g>
  <g fill="#2747b8">
    <path d="M226 280 l-10 -6 v12 z"/>
    <path d="M346 280 l-10 -6 v12 z"/>
    <path d="M546 280 l-10 -6 v12 z"/>
    <path d="M882 314 l-6 -10 h12 z"/>
    <path d="M74 318 l-6 -10 h12 z"/>
  </g>
  <!-- distillate tank -->
  <path d="M100 240 V300 H162 V240" fill="#fff" stroke="#2747b8" stroke-width="2"/>
  <use href="#waves" x="106" y="258" stroke="#2747b8"/>
  <use href="#waves" x="106" y="270" stroke="#2747b8"/>
  <use href="#waves" x="106" y="282" stroke="#2747b8"/>
  <text x="131" y="214" text-anchor="middle" font-size="14" font-style="italic" font-weight="700" fill="#2747b8">Distillate</text>
  <text x="131" y="231" text-anchor="middle" font-size="14" font-style="italic" font-weight="700" fill="#2747b8">tank</text>
  <!-- heat sink -->
  <rect x="262" y="262" width="28" height="38" fill="#fff" stroke="#2747b8" stroke-width="2" transform="skewY(-8) translate(0 37)"/>
  <text x="276" y="326" text-anchor="middle" font-size="14" font-style="italic" font-weight="700" fill="#2747b8">Heat sink</text>
  <text x="300" y="250" font-size="14" font-style="italic" fill="#2747b8">q<tspan font-size="10" dy="3">c</tspan></text>
  <path d="M268 292 L292 256" stroke="#2747b8" stroke-width="1.4" marker-end="url(#ab)"/>
  <path d="M760 262 q5 -4 10 0 t10 0 t10 0 t10 0 t10 0" fill="none" stroke="#2747b8" stroke-width="1.4"/>

  <!-- state points -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <g fill="#fff" stroke="#b42323" stroke-width="1.8">
      <circle cx="600" cy="80" r="13"/><circle cx="610" cy="22" r="13"/><circle cx="910" cy="206" r="13"/>
      <circle cx="694" cy="214" r="13"/><circle cx="536" cy="214" r="13"/><circle cx="352" cy="214" r="13"/>
      <circle cx="630" cy="160" r="13"/><circle cx="800" cy="160" r="13"/><circle cx="756" cy="78" r="13"/>
    </g>
    <g fill="#b42323">
      <text x="600" y="85">1</text><text x="610" y="27">2</text><text x="910" y="211">3</text>
      <text x="694" y="219">4</text><text x="536" y="219">5</text><text x="352" y="219">6</text>
      <text x="630" y="165">7</text><text x="800" y="165">8</text><text x="756" y="83">9</text>
    </g>
    <text x="630" y="84" text-anchor="start" font-style="italic" fill="#b42323" font-size="14" transform="translate(-10 0)"><tspan x="622">Brackish</tspan><tspan x="622" dy="16">water well</tspan></text>
    <text x="776" y="83" text-anchor="start" font-style="italic" fill="#b42323">Reject, λ</text>
    <g fill="#fff" stroke="#2747b8" stroke-width="1.8">
      <circle cx="346" cy="308" r="13"/><circle cx="546" cy="308" r="13"/><circle cx="910" cy="314" r="13"/>
      <circle cx="226" cy="252" r="13"/><circle cx="50" cy="312" r="13"/>
    </g>
    <g fill="#2747b8">
      <text x="346" y="313">10</text><text x="546" y="313">11</text><text x="910" y="319">12</text>
      <text x="226" y="257">13</text><text x="50" y="317">14</text>
    </g>
  </g>
</svg>
